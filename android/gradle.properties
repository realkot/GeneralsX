# GeneralsX @build Codex 15/10/2026 Package the full 4x UI pack without a 2 GiB heap ceiling.
org.gradle.jvmargs=-Xmx6144m
# GeneralsX @bugfix Android port 08/07/2026 Material Components (added for the
# Settings-app redesign) transitively pulls in AndroidX libraries; Gradle's
# checkDebugAarMetadata fails the build outright if this is false while any
# AndroidX dependency is on the classpath.
